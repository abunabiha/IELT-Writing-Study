<!DOCTYPE html>
<html lang="id" style="background-color: #020617; color: #f8fafc;">
  <head>
    <meta charset="utf-8">
    <title>IELTS Writing Band 8 Master</title>
    <script>
      // Single Page App redirect for GitHub Pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
    <meta http-equiv="refresh" content="0;URL='./'">
  </head>
  <body style="background-color: #020617; color: #f8fafc; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center;">
    <div>
      <h3>Mengalihkan ke aplikasi...</h3>
      <p><a href="./" style="color: #818cf8;">Klik di sini jika tidak beralih otomatis</a></p>
    </div>
  </body>
</html>
