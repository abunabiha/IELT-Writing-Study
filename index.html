<!DOCTYPE html>
<html lang="id" style="background-color: #020617; color: #f8fafc;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IELTS Writing Band 8 Master - Interactive GameWriting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Auto-recover from stale chunks on updated builds
      window.addEventListener('vite:preloadError', function() {
        window.location.reload();
      });
    </script>
    <style>
      html, body {
        background-color: #020617 !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      @keyframes spinLoader {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body style="background-color: #020617; color: #f8fafc;" class="bg-slate-950 text-slate-100 min-h-screen font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root">
      <!-- Fallback loader displayed while JavaScript bundle compiles/mounts -->
      <div style="min-height: 100vh; background-color: #020617; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #f8fafc; text-align: center; padding: 24px;">
        <div style="width: 52px; height: 52px; border: 4px solid #1e293b; border-top-color: #6366f1; border-radius: 50%; animation: spinLoader 0.9s linear infinite; margin-bottom: 24px;"></div>
        <h2 style="font-size: 20px; font-weight: 800; margin: 0 0 8px 0; color: #ffffff; letter-spacing: -0.02em;">IELTS Writing Band 8 Master</h2>
        <p style="font-size: 13px; color: #94a3b8; margin: 0 0 20px 0; max-width: 380px; line-height: 1.5;">Memuat simulasi ujian, visualizer grafik, bank 6000 kosakata, dan ruang latihan...</p>
        <button id="fallback-reload-btn" onclick="window.location.reload(true)" style="display: none; padding: 10px 20px; background-color: #4f46e5; color: #ffffff; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);">Muat Ulang Aplikasi</button>
      </div>
      <script>
        setTimeout(function() {
          var btn = document.getElementById('fallback-reload-btn');
          if (btn) btn.style.display = 'inline-block';
        }, 4000);
      </script>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
